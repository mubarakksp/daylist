<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f1">
  <title>Daylist — a little more focus</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f5f1;
      --surface: #fffefa;
      --ink: #252923;
      --muted: #898c83;
      --line: #e9e8e1;
      --accent: #52775b;
      --accent-soft: #e8eee6;
      --danger: #b65b4d;
      --shadow: 0 18px 55px rgb(46 48 39 / 7%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #171a17;
        --surface: #20241f;
        --ink: #eef0e9;
        --muted: #a0a498;
        --line: #343a32;
        --accent: #9abb9a;
        --accent-soft: #2c382d;
        --danger: #e08b7c;
        --shadow: 0 18px 55px rgb(0 0 0 / 22%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 64px 20px 48px;
      background:
        radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 42%),
        var(--page);
      color: var(--ink);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(100%, 480px);
      margin: 0 auto;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 38px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .topline-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .map-button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--accent);
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .02em;
      text-transform: none;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .map-button:hover { border-color: var(--accent); background: var(--accent-soft); }
    .map-button svg { width: 14px; height: 14px; }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      letter-spacing: .08em;
    }

    .brand-mark {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      border-radius: 8px;
      background: var(--accent);
      color: var(--surface);
    }

    .brand-mark svg { width: 15px; height: 15px; }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 8vw, 46px);
      font-weight: 400;
      letter-spacing: -.045em;
      line-height: 1.05;
    }

    .subtitle {
      margin: 11px 0 27px;
      color: var(--muted);
      font-size: 15px;
    }

    .summary {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 26px;
      padding: 15px 17px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: color-mix(in srgb, var(--surface) 72%, transparent);
    }

    .progress-ring {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      transform: rotate(-90deg);
    }

    .progress-ring circle {
      fill: none;
      stroke-width: 3;
    }

    .progress-track { stroke: var(--line); }
    .progress-value {
      stroke: var(--accent);
      stroke-linecap: round;
      stroke-dasharray: 88;
      stroke-dashoffset: 88;
      transition: stroke-dashoffset 420ms ease;
    }

    .summary-copy { flex: 1; min-width: 0; }
    .summary-title { font-size: 13px; font-weight: 650; }
    .summary-note { margin-top: 1px; color: var(--muted); font-size: 12px; }
    .summary-count { color: var(--muted); font-size: 12px; white-space: nowrap; }

    .add-form {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 25px;
      padding: 7px 8px 7px 16px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .add-form:focus-within {
      border-color: color-mix(in srgb, var(--accent) 60%, var(--line));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent), var(--shadow);
    }

    .add-symbol { color: var(--accent); font-size: 22px; font-weight: 300; line-height: 1; }

    .add-form input {
      flex: 1;
      min-width: 0;
      padding: 9px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 14px;
    }

    .add-form input::placeholder { color: var(--muted); opacity: .8; }

    .selected-place {
      margin: -13px 3px 20px;
      color: var(--accent);
      font-size: 12px;
    }

    .add-button {
      padding: 8px 13px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      transition: transform 160ms ease, opacity 160ms ease;
    }

    .add-button:hover { opacity: .9; }
    .add-button:active { transform: scale(.96); }

    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 9px;
    }

    .list-heading h2 {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .filters { display: flex; gap: 3px; }

    .filter {
      padding: 5px 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      transition: color 160ms ease, background 160ms ease;
    }

    .filter:hover { color: var(--ink); }
    .filter[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }

    .task-list {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .task {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 61px;
      padding: 11px 12px 11px 16px;
      border-bottom: 1px solid var(--line);
      animation: arrive 260ms cubic-bezier(.2,.8,.2,1) both;
    }

    .task:last-child { border-bottom: 0; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .check-wrap {
      position: relative;
      display: grid;
      flex: 0 0 20px;
      width: 20px;
      height: 20px;
      place-items: center;
    }

    .check-wrap input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
      opacity: 0;
    }

    .checkmark {
      display: grid;
      width: 19px;
      height: 19px;
      place-items: center;
      border: 1.5px solid #c9ccc3;
      border-radius: 50%;
      color: transparent;
      pointer-events: none;
      transition: background 220ms ease, border-color 220ms ease, transform 260ms cubic-bezier(.2,1.5,.5,1), color 180ms ease;
    }

    .checkmark svg { width: 11px; height: 11px; stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset 220ms ease 60ms; }
    .check-wrap input:hover + .checkmark { border-color: var(--accent); }
    .check-wrap input:focus-visible + .checkmark { outline: 3px solid color-mix(in srgb, var(--accent) 28%, transparent); outline-offset: 3px; }
    .check-wrap input:checked + .checkmark { transform: scale(1.08); border-color: var(--accent); background: var(--accent); color: white; }
    .check-wrap input:checked + .checkmark svg { stroke-dashoffset: 0; }

    .task-copy {
      display: grid;
      flex: 1;
      min-width: 0;
      gap: 2px;
    }

    .task-text {
      overflow-wrap: anywhere;
      font-size: 14px;
      transition: color 220ms ease, opacity 220ms ease;
    }

    .task.is-complete .task-text { color: var(--muted); opacity: .7; text-decoration: line-through; text-decoration-thickness: 1px; }
    .task-location { overflow-wrap: anywhere; color: var(--accent); font-size: 11px; }

    .map-dialog {
      width: min(600px, calc(100vw - 28px));
      max-width: none;
      max-height: min(92vh, 760px);
      padding: 0;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow);
    }

    .map-dialog::backdrop { background: rgb(17 22 17 / 55%); backdrop-filter: blur(3px); }
    .map-picker { padding: 18px; }

    .map-dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .map-dialog-title { margin: 0; font-family: Georgia, serif; font-size: 22px; font-weight: 400; }
    .map-close {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 20px;
    }

    .map-search { display: flex; gap: 8px; margin-bottom: 8px; }
    .map-search input, .place-name-input {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
    }

    .map-search input { flex: 1; }
    .map-search button, .map-secondary, .map-confirm {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .map-search button:hover, .map-secondary:hover { background: var(--accent-soft); }
    .map-message { min-height: 20px; margin: 2px 2px 7px; color: var(--muted); font-size: 11px; }
    .map-results { display: grid; gap: 4px; margin-bottom: 8px; }

    .map-result {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      text-align: left;
    }

    .map-result:hover { border-color: var(--accent); background: var(--accent-soft); }

    .map-viewport {
      position: relative;
      height: min(48vh, 360px);
      min-height: 245px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #e4e6df;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .map-viewport:active { cursor: grabbing; }
    .map-tiles { position: absolute; inset: 0; overflow: hidden; }
    .map-tile { position: absolute; width: 256px; height: 256px; max-width: none; pointer-events: none; }

    .map-center-pin {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      width: 30px;
      height: 40px;
      transform: translate(-50%, -100%);
      pointer-events: none;
      filter: drop-shadow(0 2px 3px rgb(0 0 0 / 35%));
    }

    .map-zoom {
      position: absolute;
      z-index: 3;
      top: 10px;
      left: 10px;
      display: grid;
      gap: 5px;
    }

    .map-zoom button {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 19px;
      box-shadow: 0 2px 8px rgb(0 0 0 / 12%);
    }

    .map-coordinates { margin: 8px 2px 12px; color: var(--muted); font-size: 11px; }
    .place-label { display: grid; gap: 5px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .place-name-input { width: 100%; }

    .map-dialog-footer {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 15px;
    }

    .map-footer-actions { display: flex; gap: 8px; }
    .map-confirm { border-color: var(--accent); background: var(--accent); color: #fff; }
    .map-confirm:hover { opacity: .9; }
    .map-attribution { margin: 9px 1px 0; color: var(--muted); font-size: 10px; }
    .map-attribution a { color: inherit; }

    .delete-button {
      display: grid;
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      place-items: center;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      opacity: 0;
      transition: color 160ms ease, background 160ms ease, opacity 160ms ease;
    }

    .task:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
    .delete-button:hover { background: color-mix(in srgb, var(--danger) 11%, transparent); color: var(--danger); }
    .delete-button svg { width: 15px; height: 15px; }

    .empty-state {
      padding: 34px 18px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .empty-state span { display: block; margin-bottom: 5px; color: var(--ink); font-family: Georgia, serif; font-size: 19px; }

    .list-footer {
      display: flex;
      justify-content: space-between;
      padding: 12px 2px 0;
      color: var(--muted);
      font-size: 11px;
    }

    .clear-button {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: inherit;
      transition: color 160ms ease;
    }

    .clear-button:hover { color: var(--danger); }
    .clear-button:disabled { visibility: hidden; }

    button:focus-visible, input:focus-visible { outline-color: var(--accent); }

    @media (max-width: 520px) {
      body { padding: 36px 18px 32px; }
      .topline { margin-bottom: 31px; }
      .topline-actions { gap: 7px; }
      #today { font-size: 10px; }
      .task { min-height: 59px; }
      .delete-button { opacity: .75; }
    }

    @media (max-width: 360px) {
      #today { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topline">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none"><path d="m5 10 3.2 3.2L15.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        DAYLIST
      </div>
      <div class="topline-actions">
        <button class="map-button" id="open-map" type="button" aria-label="Choose a task location">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 17s5-4.8 5-9a5 5 0 1 0-10 0c0 4.2 5 9 5 9Z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="8" r="1.7" fill="currentColor"/></svg>
          Map
        </button>
        <span id="today"></span>
      </div>
    </header>

    <h1>A little more<br>focus.</h1>
    <p class="subtitle">Make space for what matters today.</p>

    <section class="summary" aria-label="Task progress">
      <svg class="progress-ring" viewBox="0 0 34 34" aria-hidden="true">
        <circle class="progress-track" cx="17" cy="17" r="14"></circle>
        <circle class="progress-value" id="progress-value" cx="17" cy="17" r="14"></circle>
      </svg>
      <div class="summary-copy">
        <div class="summary-title" id="progress-title">A fresh start</div>
        <div class="summary-note" id="progress-note">One thing at a time.</div>
      </div>
      <div class="summary-count" id="progress-count"></div>
    </section>

    <form class="add-form" id="add-form">
      <span class="add-symbol" aria-hidden="true">+</span>
      <input id="new-task" type="text" maxlength="160" placeholder="Add a task to your day..." aria-label="New task" autocomplete="off">
      <button class="add-button" type="submit">Add task</button>
    </form>
    <div class="selected-place" id="pending-place" role="status" aria-live="polite" hidden></div>

    <section aria-labelledby="tasks-heading">
      <div class="list-heading">
        <h2 id="tasks-heading">Your list</h2>
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter" type="button" data-filter="completed" aria-pressed="false">Done</button>
        </div>
      </div>
      <div class="task-list" id="task-list" aria-live="polite"></div>
      <div class="list-footer">
        <span id="remaining-label"></span>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </div>
    </section>
  </main>

  <dialog class="map-dialog" id="map-dialog" aria-labelledby="map-title">
    <div class="map-picker">
      <div class="map-dialog-header">
        <h2 class="map-dialog-title" id="map-title">Choose a place</h2>
        <button class="map-close" id="close-map" type="button" aria-label="Close map">×</button>
      </div>
      <form class="map-search" id="place-search">
        <input id="place-query" type="search" placeholder="Search a city, address, or place" aria-label="Search a place">
        <button type="submit">Search</button>
      </form>
      <div class="map-message" id="map-message" role="status" aria-live="polite">Search for a place, use your location, or drag the map.</div>
      <div class="map-results" id="map-results"></div>
      <div class="map-viewport" id="map-viewport" role="application" tabindex="0" aria-label="Map. Drag to move the pin under the center marker.">
        <div class="map-tiles" id="map-tiles"></div>
        <svg class="map-center-pin" viewBox="0 0 30 40" aria-hidden="true">
          <path d="M15 39S2 22.7 2 15a13 13 0 1 1 26 0c0 7.7-13 24-13 24Z" fill="#52775b" stroke="#fff" stroke-width="2"/>
          <circle cx="15" cy="15" r="4" fill="#fff"/>
        </svg>
        <div class="map-zoom" aria-label="Map zoom">
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
        </div>
      </div>
      <div class="map-coordinates" id="map-coordinates">Move the map to place the pin.</div>
      <label class="place-label" for="place-name">
        Place name
        <input class="place-name-input" id="place-name" type="text" maxlength="100" placeholder="e.g. Green Market">
      </label>
      <div class="map-dialog-footer">
        <button class="map-secondary" id="use-current-location" type="button">Use my location</button>
        <div class="map-footer-actions">
          <button class="map-secondary" id="cancel-map" type="button">Cancel</button>
          <button class="map-confirm" id="use-map-location" type="button">Use this place</button>
        </div>
      </div>
      <p class="map-attribution">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a> · Tiles by OpenStreetMap.de</p>
    </div>
  </dialog>

  <script>
    (() => {
      const STORAGE_KEY = "daylist.tasks.v1";
      const examples = [
        { id: "sample-1", text: "Write down the three things that matter most", completed: false },
        { id: "sample-2", text: "Reply to the messages waiting in my inbox", completed: false },
        { id: "sample-3", text: "Take a proper break and get some fresh air", completed: false }
      ];

      const list = document.querySelector("#task-list");
      const form = document.querySelector("#add-form");
      const input = document.querySelector("#new-task");
      const clearButton = document.querySelector("#clear-completed");
      const mapDialog = document.querySelector("#map-dialog");
      const mapViewport = document.querySelector("#map-viewport");
      const mapTiles = document.querySelector("#map-tiles");
      const mapMessage = document.querySelector("#map-message");
      const mapResults = document.querySelector("#map-results");
      const placeName = document.querySelector("#place-name");
      const pendingPlace = document.querySelector("#pending-place");
      let pendingLocation = null;
      let mapCenter = { lat: 20, lon: 0 };
      let mapZoom = 2;
      let dragStart = null;
      let lastPlaceSearchAt = 0;
      let placeSearchInFlight = false;
      const tileCache = new Map();
      let filter = "all";
      let tasks = loadTasks();

      function loadTasks() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved === null) return examples;

        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed)) return examples;
        return parsed.filter(task =>
          task && typeof task.id === "string" &&
          typeof task.text === "string" &&
          typeof task.completed === "boolean"
        ).map(task => {
          const place = task.location;
          if (!place || typeof place.label !== "string" ||
              !Number.isFinite(place.lat) || !Number.isFinite(place.lon) ||
              place.lat < -90 || place.lat > 90 || place.lon < -180 || place.lon > 180) {
            return { id: task.id, text: task.text, completed: task.completed };
          }
          return {
            id: task.id,
            text: task.text,
            completed: task.completed,
            location: { label: place.label.slice(0, 100), lat: place.lat, lon: place.lon }
          };
        });
      }

      function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function project(lat, lon, zoom) {
        const scale = 256 * 2 ** zoom;
        const boundedLat = Math.max(-85.0511, Math.min(85.0511, lat));
        const sin = Math.sin(boundedLat * Math.PI / 180);
        return {
          x: (lon + 180) / 360 * scale,
          y: (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * scale
        };
      }

      function unproject(x, y, zoom) {
        const scale = 256 * 2 ** zoom;
        const lon = x / scale * 360 - 180;
        const n = Math.PI - 2 * Math.PI * y / scale;
        return {
          lat: Math.max(-85.0511, Math.min(85.0511, 180 / Math.PI * Math.atan(Math.sinh(n)))),
          lon: Math.max(-180, Math.min(180, lon))
        };
      }

      function updateMapCoordinates() {
        document.querySelector("#map-coordinates").textContent =
          `Pin center · ${mapCenter.lat.toFixed(5)}, ${mapCenter.lon.toFixed(5)} · zoom ${mapZoom}`;
      }

      function renderMap() {
        const width = mapViewport.clientWidth;
        const height = mapViewport.clientHeight;
        if (!width || !height) return;

        const center = project(mapCenter.lat, mapCenter.lon, mapZoom);
        const count = 2 ** mapZoom;
        const startX = Math.floor((center.x - width / 2) / 256) - 1;
        const endX = Math.floor((center.x + width / 2) / 256) + 1;
        const startY = Math.max(0, Math.floor((center.y - height / 2) / 256) - 1);
        const endY = Math.min(count - 1, Math.floor((center.y + height / 2) / 256) + 1);
        const visibleTiles = [];

        for (let tileY = startY; tileY <= endY; tileY++) {
          for (let tileX = startX; tileX <= endX; tileX++) {
            const wrappedX = ((tileX % count) + count) % count;
            const key = `${mapZoom}/${wrappedX}/${tileY}`;
            let tile = tileCache.get(key);
            if (!tile) {
              tile = new Image();
              tile.className = "map-tile";
              tile.dataset.tileKey = key;
              tile.alt = "";
              tile.draggable = false;
              tile.src = `https://tile.openstreetmap.de/${key}.png`;
              tile.onerror = () => {
                mapMessage.textContent = "Map tiles couldn't load. Check your internet connection.";
              };
              tileCache.set(key, tile);
            }
            tile.style.left = `${tileX * 256 - center.x + width / 2}px`;
            tile.style.top = `${tileY * 256 - center.y + height / 2}px`;
            visibleTiles.push(tile);
          }
        }
        mapTiles.replaceChildren(...visibleTiles);
        const visibleKeys = new Set(visibleTiles.map(tile => tile.dataset.tileKey));
        for (const [key, tile] of tileCache) {
          if (tileCache.size <= 100) break;
          if (!visibleKeys.has(key)) tileCache.delete(key);
        }
        updateMapCoordinates();
      }

      function updatePendingPlace() {
        pendingPlace.hidden = !pendingLocation;
        pendingPlace.textContent = pendingLocation
          ? `📍 Next task location: ${pendingLocation.label}`
          : "";
        document.querySelector("#open-map").setAttribute(
          "aria-label",
          pendingLocation ? `Change task location, currently ${pendingLocation.label}` : "Choose a task location"
        );
      }

      function openMapPicker() {
        const savedLocation = pendingLocation || tasks.find(task => task.location)?.location;
        if (savedLocation) {
          mapCenter = { lat: savedLocation.lat, lon: savedLocation.lon };
          mapZoom = 16;
          placeName.value = savedLocation.label;
        } else {
          mapCenter = { lat: 20, lon: 0 };
          mapZoom = 2;
          placeName.value = "";
        }
        mapResults.replaceChildren();
        mapMessage.textContent = "Search for a place, use your location, or drag the map.";
        mapDialog.showModal();
        requestAnimationFrame(renderMap);
      }

      function shiftMapByPixels(deltaX, deltaY, zoom = mapZoom) {
        const center = project(mapCenter.lat, mapCenter.lon, zoom);
        mapZoom = zoom;
        mapCenter = unproject(center.x - deltaX, center.y - deltaY, mapZoom);
        renderMap();
      }

      function useCoordinates(lat, lon, label) {
        mapCenter = {
          lat: Math.max(-85.0511, Math.min(85.0511, lat)),
          lon: Math.max(-180, Math.min(180, lon))
        };
        mapZoom = 16;
        if (label) placeName.value = label.slice(0, 100);
        mapMessage.textContent = "Drag the map to move the pin under the center marker.";
        mapResults.replaceChildren();
        renderMap();
      }

      async function searchPlaces(query) {
        const search = query.trim();
        if (!search) {
          mapMessage.textContent = "Enter a city, address, or place to search.";
          return;
        }
        if (placeSearchInFlight) return;

        placeSearchInFlight = true;
        mapMessage.textContent = "Searching OpenStreetMap…";
        mapResults.replaceChildren();
        const url = new URL("https://nominatim.openstreetmap.org/search");
        url.searchParams.set("format", "jsonv2");
        url.searchParams.set("limit", "5");
        url.searchParams.set("q", search);
        try {
          const wait = Math.max(0, 1000 - (Date.now() - lastPlaceSearchAt));
          if (wait) await new Promise(resolve => setTimeout(resolve, wait));
          lastPlaceSearchAt = Date.now();
          const response = await fetch(url);
          if (!response.ok) throw new Error(`Place search failed (${response.status}).`);
          const results = await response.json();
          if (!results.length) {
            mapMessage.textContent = "No matching places found.";
            return;
          }
          mapMessage.textContent = "Choose a result, then drag the map to fine-tune the pin.";
          results.forEach(result => {
            const button = document.createElement("button");
            button.className = "map-result";
            button.type = "button";
            button.textContent = result.display_name;
            button.addEventListener("click", () => {
              useCoordinates(Number(result.lat), Number(result.lon),
                result.name || result.display_name.split(",")[0]);
            });
            mapResults.append(button);
          });
        } catch (error) {
          mapMessage.textContent = "Place search is unavailable. Check your connection and try again.";
        } finally {
          placeSearchInFlight = false;
        }
      }

      function makeTaskElement(task, index) {
        const row = document.createElement("div");
        row.className = `task${task.completed ? " is-complete" : ""}`;
        row.dataset.id = task.id;
        row.style.animationDelay = `${Math.min(index, 5) * 35}ms`;

        const checkWrap = document.createElement("label");
        checkWrap.className = "check-wrap";
        checkWrap.setAttribute("aria-label", `${task.completed ? "Mark incomplete" : "Complete"}: ${task.text}`);

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.dataset.action = "toggle";
        checkbox.setAttribute("aria-label", `${task.completed ? "Mark incomplete" : "Complete"}: ${task.text}`);

        const checkmark = document.createElement("span");
        checkmark.className = "checkmark";
        checkmark.setAttribute("aria-hidden", "true");
        checkmark.innerHTML = '<svg viewBox="0 0 12 12" fill="none"><path d="m2 6 2.5 2.5L10 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const copy = document.createElement("div");
        copy.className = "task-copy";
        copy.append(text);
        if (task.location) {
          const location = document.createElement("span");
          location.className = "task-location";
          location.textContent = `Near ${task.location.label}`;
          location.title = `${task.location.lat.toFixed(5)}, ${task.location.lon.toFixed(5)}`;
          copy.append(location);
        }

        const remove = document.createElement("button");
        remove.className = "delete-button";
        remove.type = "button";
        remove.dataset.action = "delete";
        remove.setAttribute("aria-label", `Delete: ${task.text}`);
        remove.innerHTML = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4.5 6h11M8 6V4.5h4V6m-6.5 0 .7 9h6.6l.7-9M8.5 9v3.5m3-3.5v3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        checkWrap.append(checkbox, checkmark);
        row.append(checkWrap, copy, remove);
        return row;
      }

      function render() {
        const visible = tasks.filter(task =>
          filter === "all" ||
          (filter === "active" && !task.completed) ||
          (filter === "completed" && task.completed)
        );
        list.replaceChildren();

        if (visible.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          const title = document.createElement("span");
          title.textContent = filter === "completed" ? "Nothing checked off yet" : "A clear little slate";
          const note = document.createElement("div");
          note.textContent = filter === "active" ? "You're all caught up." : "Add a task whenever you're ready.";
          empty.append(title, note);
          list.append(empty);
        } else {
          visible.forEach((task, index) => list.append(makeTaskElement(task, index)));
        }

        const complete = tasks.filter(task => task.completed).length;
        const remaining = tasks.length - complete;
        const ratio = tasks.length ? complete / tasks.length : 0;
        document.querySelector("#progress-value").style.strokeDashoffset = String(88 - ratio * 88);
        document.querySelector("#progress-title").textContent =
          tasks.length === 0 ? "A fresh start" :
          remaining === 0 ? "Lovely work" :
          complete ? "You're finding your flow" : "A fresh start";
        document.querySelector("#progress-note").textContent =
          tasks.length === 0 ? "Add one small thing to begin." :
          remaining === 0 ? "Everything on your list is done." :
          "One thing at a time.";
        document.querySelector("#progress-count").textContent = tasks.length ? `${complete} of ${tasks.length} done` : "";
        document.querySelector("#remaining-label").textContent =
          `${remaining} ${remaining === 1 ? "task" : "tasks"} left`;
        clearButton.disabled = complete === 0;
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          input.focus();
          return;
        }
        tasks.unshift({ id: crypto.randomUUID(), text, completed: false });
        if (pendingLocation) {
          tasks[0].location = { ...pendingLocation };
          pendingLocation = null;
          updatePendingPlace();
        }
        filter = "all";
        document.querySelectorAll(".filter").forEach(button =>
          button.setAttribute("aria-pressed", String(button.dataset.filter === filter))
        );
        saveTasks();
        render();
        form.reset();
        input.focus();
      });

      list.addEventListener("change", event => {
        if (event.target.dataset.action !== "toggle") return;
        const row = event.target.closest(".task");
        const task = tasks.find(item => item.id === row.dataset.id);
        if (!task) return;
        task.completed = event.target.checked;
        saveTasks();
        render();
      });

      list.addEventListener("click", event => {
        const button = event.target.closest('[data-action="delete"]');
        if (!button) return;
        const row = button.closest(".task");
        tasks = tasks.filter(task => task.id !== row.dataset.id);
        saveTasks();
        render();
      });

      document.querySelectorAll(".filter").forEach(button => {
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          document.querySelectorAll(".filter").forEach(item =>
            item.setAttribute("aria-pressed", String(item === button))
          );
          render();
        });
      });

      clearButton.addEventListener("click", () => {
        tasks = tasks.filter(task => !task.completed);
        saveTasks();
        render();
      });

      document.querySelector("#open-map").addEventListener("click", openMapPicker);
      document.querySelector("#close-map").addEventListener("click", () => mapDialog.close());
      document.querySelector("#cancel-map").addEventListener("click", () => mapDialog.close());
      mapDialog.addEventListener("click", event => {
        if (event.target === mapDialog) mapDialog.close();
      });

      document.querySelector("#place-search").addEventListener("submit", event => {
        event.preventDefault();
        searchPlaces(document.querySelector("#place-query").value);
      });

      document.querySelector("#use-current-location").addEventListener("click", () => {
        if (!navigator.geolocation) {
          mapMessage.textContent = "This browser doesn't provide location access.";
          return;
        }
        mapMessage.textContent = "Getting your current location…";
        navigator.geolocation.getCurrentPosition(
          position => useCoordinates(position.coords.latitude, position.coords.longitude, "Current location"),
          error => {
            mapMessage.textContent = error.code === error.PERMISSION_DENIED
              ? "Allow location access in your browser settings, or search for a place."
              : "Couldn't determine your location. Check your connection or try a place search.";
          },
          { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 }
        );
      });

      document.querySelector("#use-map-location").addEventListener("click", () => {
        const label = placeName.value.trim() || `Pinned place (${mapCenter.lat.toFixed(4)}, ${mapCenter.lon.toFixed(4)})`;
        pendingLocation = { label: label.slice(0, 100), lat: mapCenter.lat, lon: mapCenter.lon };
        updatePendingPlace();
        mapDialog.close();
        input.focus();
      });

      document.querySelector("#zoom-in").addEventListener("click", () => {
        if (mapZoom < 19) shiftMapByPixels(0, 0, mapZoom + 1);
      });
      document.querySelector("#zoom-out").addEventListener("click", () => {
        if (mapZoom > 2) shiftMapByPixels(0, 0, mapZoom - 1);
      });

      mapViewport.addEventListener("pointerdown", event => {
        if (event.target.closest(".map-zoom")) return;
        dragStart = {
          x: event.clientX,
          y: event.clientY,
          world: project(mapCenter.lat, mapCenter.lon, mapZoom)
        };
        mapViewport.setPointerCapture(event.pointerId);
      });

      mapViewport.addEventListener("pointermove", event => {
        if (!dragStart) return;
        const worldX = dragStart.world.x - (event.clientX - dragStart.x);
        const worldY = dragStart.world.y - (event.clientY - dragStart.y);
        mapCenter = unproject(worldX, worldY, mapZoom);
        renderMap();
      });

      const finishMapDrag = () => { dragStart = null; };
      mapViewport.addEventListener("pointerup", finishMapDrag);
      mapViewport.addEventListener("pointercancel", finishMapDrag);
      mapViewport.addEventListener("wheel", event => {
        event.preventDefault();
        const nextZoom = Math.max(2, Math.min(19, mapZoom + (event.deltaY < 0 ? 1 : -1)));
        if (nextZoom !== mapZoom) shiftMapByPixels(0, 0, nextZoom);
      }, { passive: false });
      window.addEventListener("resize", () => {
        if (mapDialog.open) renderMap();
      });

      document.querySelector("#today").textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "short", month: "short", day: "numeric"
      }).format(new Date());
      render();
    })();
  </script>
</body>
</html>
